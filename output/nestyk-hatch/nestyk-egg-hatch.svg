<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title"><title id="title">NESTYK egg animation</title><style>
.shell{fill:#FFF5DA;stroke:#211E1E;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><style>
.cap{transform-origin:210px 157px;animation:open 1.1s .2s cubic-bezier(.2,.7,.3,1) both}
.bird{animation:rise 1.1s .45s cubic-bezier(.2,.7,.3,1) both}
.wing{transform-origin:179px 199px;animation:flap .7s 1.4s ease-in-out both}
.spark{transform-origin:239px 91px;animation:shine .6s 1.65s ease-out both}
@keyframes open{0%{transform:translate(0,0) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(47px,-65px) rotate(38deg);opacity:0}}
@keyframes rise{0%{transform:translateY(112px)}80%{transform:translateY(-5px)}100%{transform:translateY(0)}}
@keyframes flap{0%,100%{transform:rotate(0)}45%{transform:rotate(-16deg)}}
@keyframes shine{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
</style><defs><clipPath id="reveal"><path d="M70 20H265V199L215 205 192 185 166 206 140 186 114 205 70 187Z"/></clipPath></defs><ellipse cx="160" cy="265" rx="78" ry="10" fill="#EAD9B0" opacity=".4"/>
<g clip-path="url(#reveal)"><g class="bird">
<path d="M124 226V123L105 115 125 104C126 78 170 76 178 104L187 173Q215 158 223 170Q236 194 211 215L190 229Z" fill="#F8B615" stroke="#211E1E" stroke-width="6" stroke-linejoin="round"/>
<circle cx="147" cy="107" r="6" fill="#211E1E"/>
<g class="wing"><path d="M177 196Q190 176 207 153Q219 140 226 151Q231 161 218 175Q237 162 241 176Q244 185 226 198Q214 210 196 214" fill="#F8B615" stroke="#211E1E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
</g></g>
<path class="shell" d="M83 185L109 204 134 183 160 205 187 184 213 204 237 185C237 232 208 256 160 256S83 232 83 185Z"/>
<g class="cap"><path class="shell" d="M83 185C83 126 119 60 160 60S237 126 237 185L213 204 187 184 160 205 134 183 109 204Z"/><path d="M118 118Q128 95 143 88" fill="none" stroke="#F8B615" stroke-width="7" stroke-linecap="round"/></g>
<path class="spark" d="M239 73Q242 88 254 91Q242 94 239 109Q236 94 224 91Q236 88 239 73" fill="#F8B615"/>
</svg>
