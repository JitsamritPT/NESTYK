<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title"><title id="title">NESTYK hatching bird</title><style>.shell{fill:#FFF5DA;stroke:#211E1E;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}</style><style>
.rock{transform-origin:160px 256px;animation:rock 5.6s infinite}
.whole{animation:whole 5.6s infinite}
.crack{stroke-dasharray:220;stroke-dashoffset:220;animation:crack 5.6s infinite}
.cap{animation:cap 5.6s infinite}
.bird{animation:peek 5.6s infinite}
@keyframes rock{0%,15%,32%,100%{transform:rotate(0)}20%{transform:rotate(-3deg)}25%{transform:rotate(3deg)}}
@keyframes whole{0%,28%{opacity:1}29%,87%{opacity:0}92%,100%{opacity:1}}
@keyframes crack{0%,16%{stroke-dashoffset:220;opacity:0}17%{opacity:1}28%,80%{stroke-dashoffset:0;opacity:1}88%,100%{stroke-dashoffset:220;opacity:0}}
@keyframes cap{0%,32%,83%,100%{transform:translateY(0)}46%,65%{transform:translateY(-66px)}}
@keyframes peek{0%,32%,83%,100%{transform:translateY(140px)}46%,65%{transform:translateY(40px)}52%{transform:translate(3px,40px)}60%{transform:translate(-3px,40px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.bird{opacity:0}.whole{opacity:1}.crack{opacity:0}}
