<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title">
  <title id="title">NESTYK Honey and Cream bird hatching successfully</title>
  <defs>
    <linearGradient id="egg" x1=".2" y1="0" x2=".78" y2="1"><stop offset="0" stop-color="#FFFDF7"/><stop offset=".48" stop-color="#FFF8E8"/><stop offset="1" stop-color="#DDC9A3"/></linearGradient>
    <radialGradient id="eggLight" cx="31%" cy="22%" r="70%"><stop offset="0" stop-color="#FFF" stop-opacity=".9"/><stop offset=".58" stop-color="#FFF" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .egg{transform-origin:160px 258px;animation:egg-away 1.15s ease-in both}.crack{stroke-dasharray:190;animation:crack .72s ease-out both}.success{transform-origin:160px 286px;opacity:0;animation:hatch 1.15s .62s cubic-bezier(.18,.8,.28,1.1) both}.spark{transform-box:fill-box;transform-origin:center;opacity:0;animation:twinkle 1.8s 1.8s ease-in-out infinite}.s2{animation-delay:2.35s}.s3{animation-delay:2.9s}
    @keyframes crack{from{stroke-dashoffset:190;opacity:0}20%{opacity:.65}to{stroke-dashoffset:0;opacity:.65}}@keyframes egg-away{0%,58%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(14px) scale(.94)}}
    @keyframes hatch{0%{opacity:0;transform:translateY(40px) scale(.88)}28%{opacity:1}76%{transform:translateY(-5px) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.65) rotate(0)}50%{opacity:1;transform:scale(1.08) rotate(10deg)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.egg{opacity:0}.success{opacity:1}.spark{opacity:.8}}
  </style>
  <g class="egg">
    <ellipse cx="160" cy="270" rx="66" ry="9" fill="#5B381C" opacity=".12"/>
    <path fill="url(#egg)" d="M160 49C119 49 83 121 83 187 83 235 112 259 160 259S237 235 237 187C237 121 201 49 160 49Z"/>
    <path fill="url(#eggLight)" d="M160 49C119 49 83 121 83 187 83 235 112 259 160 259S237 235 237 187C237 121 201 49 160 49Z"/>
    <path d="M105 120Q121 79 151 67" fill="none" stroke="#FFF" stroke-width="10" stroke-linecap="round" opacity=".55"/>
    <path class="crack" d="M88 186 111 201 135 181 160 201 186 181 212 201 233 186" fill="none" stroke="#9D7B56" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="success">
    <image x="0" y="18" width="320" height="281.7" href="nestyk-honey-cream-success-v3.png" xlink:href="nestyk-honey-cream-success-v3.png" preserveAspectRatio="none"/>
  </g>
  <path class="spark" d="M248 60Q251 74 264 77Q251 80 248 94Q245 80 232 77Q245 74 248 60Z" fill="#FFD244"/>
  <path class="spark s2" d="M68 123Q70 133 80 135Q70 137 68 147Q66 137 56 135Q66 133 68 123Z" fill="#FFECA0"/>
  <circle class="spark s3" cx="259" cy="190" r="5" fill="#FFD244"/>
</svg>
